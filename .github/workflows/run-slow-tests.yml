name: run-slow-tests
on:
  # Allows manual trigger from the Actions tab
  workflow_dispatch: 
  # Trigger when creating a pull request
  pull_request:
    branches:
      - dev
      - main 
jobs:
  slow-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    env:
      RUN_SLOW_TESTS: "true"
      GITHUB_PAT: ${{ secrets.GITHUB_PAT }} 

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::devtools
            any::snowfall
          needs: check

      - name: Run Slow Tests Only
        shell: Rscript {0}
        run: |
          # Windows-specific fix for the "files too big" error
          if (Sys.info()[["sysname"]] == "Windows") {
            withr::local_options(pkg.build_extra_flags = FALSE)
          }

          # The filter looks for files with 'slow' in the name
          devtools::test(filter = "slow")
          